<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="d-flex">

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <h3>🍦 Admin Panel</h3>

        <a href="dashboard.html">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a href="products.html">
            <i class="bi bi-box-seam"></i>
            Products
        </a>

        <a href="orders.html">
            <i class="bi bi-bag"></i>
            Orders
        </a>

        <a class="active" href="users.html">
            <i class="bi bi-people"></i>
            Users
        </a>

        <a href="reports.html">
            <i class="bi bi-bar-chart"></i>
            Reports
        </a>

        <a href="#" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

    </div>


    <!-- ================= MAIN CONTENT ================= -->

    <div class="content">

        <!-- TOP BAR -->

        <div class="topbar">

            <h2>Users</h2>

            <div>

                Welcome,

                <strong id="adminName">Admin</strong>

            </div>

        </div>


        <!-- USERS CARD -->

        <div class="card mt-4">

            <div class="card-header d-flex justify-content-between align-items-center">

                <h4 class="mb-0">
                    Registered Users
                </h4>

                <input
                    type="text"
                    class="form-control"
                    placeholder="Search user..."
                    id="searchUser"
                    style="max-width:300px;"
                >

            </div>


            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Name</th>

                                <th>Email</th>

                                <th>Role</th>

                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody id="usersTable">

                            <tr>

                                <td colspan="5" class="text-center">

                                    Loading users...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

const API = "http://localhost:5000/api/admin";

let users = [];


// ======================================
// PAGE LOAD
// ======================================

document.addEventListener("DOMContentLoaded", function () {

    const currentUser = JSON.parse(
        localStorage.getItem("user")
    );


    // Admin Check

    if (!currentUser || currentUser.role !== "admin") {

        window.location.href = "../pages/login.html";

        return;

    }


    // Admin Name

    const adminName = document.getElementById("adminName");

    if (adminName) {

        adminName.innerText = currentUser.name;

    }


    // Search

    const search = document.getElementById("searchUser");

    if (search) {

        search.addEventListener(
            "input",
            searchUsers
        );

    }


    // Load Users

    loadUsers();

});


// ======================================
// LOAD USERS
// ======================================

async function loadUsers() {

    try {

        console.log("Loading users...");


        const response = await fetch(
            `${API}/users`
        );


        console.log(
            "Response Status:",
            response.status
        );


        const data = await response.json();


        console.log(
            "Users Response:",
            data
        );


        if (!data.success) {

            document.getElementById(
                "usersTable"
            ).innerHTML = `
                <tr>
                    <td colspan="5"
                        class="text-center text-danger">

                        ${data.message || "Users load failed"}

                    </td>
                </tr>
            `;

            return;

        }


        users = data.users || [];


        displayUsers(users);

    }

    catch (error) {

        console.error(
            "Users Error:",
            error
        );


        document.getElementById(
            "usersTable"
        ).innerHTML = `
            <tr>

                <td colspan="5"
                    class="text-center text-danger">

                    Unable to connect to server

                </td>

            </tr>
        `;

    }

}


// ======================================
// DISPLAY USERS
// ======================================

function displayUsers(list) {

    const table =
        document.getElementById(
            "usersTable"
        );


    if (!table) {

        console.error(
            "usersTable not found"
        );

        return;

    }


    if (list.length === 0) {

        table.innerHTML = `
            <tr>

                <td colspan="5"
                    class="text-center">

                    No users found

                </td>

            </tr>
        `;

        return;

    }


    let html = "";


    list.forEach(user => {

        html += `

            <tr>

                <td>
                    #${user.id}
                </td>


                <td>
                    <strong>
                        ${user.name}
                    </strong>
                </td>


                <td>
                    ${user.email}
                </td>


                <td>

                    <span class="badge ${
                        user.role === "admin"
                        ? "bg-success"
                        : "bg-secondary"
                    }">

                        ${user.role}

                    </span>

                </td>


                <td>

                    ${
                        user.role === "admin"

                        ?

                        `
                        <span class="text-muted">

                            <i class="bi bi-shield-check"></i>

                            Admin

                        </span>
                        `

                        :

                        `
                        <button
                            class="btn btn-danger btn-sm"
                            onclick="deleteUser(${user.id})"
                        >

                            <i class="bi bi-trash"></i>

                            Delete

                        </button>
                        `
                    }

                </td>

            </tr>

        `;

    });


    table.innerHTML = html;

}


// ======================================
// SEARCH USERS
// ======================================

function searchUsers() {

    const keyword =
        document
            .getElementById("searchUser")
            .value
            .toLowerCase()
            .trim();


    const filteredUsers =
        users.filter(user =>

            user.name
                .toLowerCase()
                .includes(keyword)

            ||

            user.email
                .toLowerCase()
                .includes(keyword)

            ||

            user.role
                .toLowerCase()
                .includes(keyword)

        );


    displayUsers(
        filteredUsers
    );

}


// ======================================
// DELETE USER
// ======================================

async function deleteUser(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this user?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/users/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        console.log(
            "Delete Response:",
            data
        );


        if (data.success) {

            alert(
                "✅ " + data.message
            );


            loadUsers();

        }

        else {

            alert(
                "❌ " +
                (
                    data.message ||
                    "Unable to delete user"
                )
            );

        }

    }

    catch (error) {

        console.error(
            "Delete Error:",
            error
        );


        alert(
            "Server Error"
        );

    }

}


// ======================================
// LOGOUT
// ======================================

function logout() {

    localStorage.clear();

    window.location.href =
        "../pages/login.html";

}

</script>

</body>

</html>
