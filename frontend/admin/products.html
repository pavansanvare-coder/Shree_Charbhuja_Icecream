<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="d-flex">

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <h3>🍦 Admin Panel</h3>

        <a href="dashboard.html">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a class="active" href="products.html">
            <i class="bi bi-box-seam"></i>
            Products
        </a>

        <a href="orders.html">
            <i class="bi bi-bag"></i>
            Orders
        </a>

        <a href="users.html">
            <i class="bi bi-people"></i>
            Users
        </a>

        <a href="reports.html">
            <i class="bi bi-bar-chart"></i>
            Reports
        </a>

        <a href="#" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

    </div>


    <!-- ================= CONTENT ================= -->

    <div class="content">

        <div class="topbar">

            <h2>Manage Products</h2>

            <button
                class="btn btn-warning"
                data-bs-toggle="modal"
                data-bs-target="#productModal"
                onclick="prepareAddProduct()">

                <i class="bi bi-plus-circle"></i>

                Add Product

            </button>

        </div>


        <!-- ================= PRODUCT TABLE ================= -->

        <div class="card mt-4">

            <div class="card-body">

                <input
                    type="text"
                    id="search"
                    class="form-control mb-4"
                    placeholder="Search Product...">


                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                        <tr>

                            <th>ID</th>

                            <th>Image</th>

                            <th>Name</th>

                            <th>Category</th>

                            <th>Price</th>

                            <th>Stock</th>

                            <th>Action</th>

                        </tr>

                        </thead>


                        <tbody id="productTable">

                            <tr>

                                <td
                                    colspan="7"
                                    class="text-center">

                                    Loading products...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ================================================= -->
<!-- PRODUCT MODAL -->
<!-- ================================================= -->

<div
    class="modal fade"
    id="productModal"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle">

                    Add Product

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <form id="productForm">

                    <input
                        type="hidden"
                        id="productId">


                    <!-- NAME -->

                    <div class="mb-3">

                        <label class="form-label">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter product name"
                            required>

                    </div>


                    <!-- CATEGORY -->

                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <input
                            type="text"
                            id="category"
                            class="form-control"
                            placeholder="Example: Ice Cream"
                            required>

                    </div>


                    <!-- PRICE + STOCK -->

                    <div class="row">

                        <div class="col-md-6">

                            <label class="form-label">
                                Price
                            </label>

                            <input
                                type="number"
                                id="price"
                                class="form-control"
                                min="0"
                                step="0.01"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Stock
                            </label>

                            <input
                                type="number"
                                id="stock"
                                class="form-control"
                                min="0"
                                required>

                        </div>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="mt-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            id="description"
                            class="form-control"
                            rows="4"
                            placeholder="Enter product description">
                        </textarea>

                    </div>


                    <!-- IMAGE -->

                    <div class="mt-3">

                        <label class="form-label">
                            Product Image
                        </label>

                        <input
                            type="file"
                            id="image"
                            class="form-control"
                            accept="image/*">

                    </div>


                    <!-- PREVIEW -->

                    <div class="mt-3">

                        <img
                            id="imagePreview"
                            src=""
                            style="
                                display:none;
                                width:120px;
                                height:120px;
                                object-fit:cover;
                                border-radius:10px;
                            ">

                    </div>


                    <!-- SAVE -->

                    <button
                        type="submit"
                        class="btn btn-warning mt-4 w-100"
                        id="saveButton">

                        <i class="bi bi-check-circle"></i>

                        Save Product

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


<!-- ================================================= -->
<!-- JAVASCRIPT -->
<!-- ================================================= -->

<script>

const API = "http://localhost:5000/api/products";

const table =
    document.getElementById("productTable");

const form =
    document.getElementById("productForm");

const search =
    document.getElementById("search");


// =====================================================
// PAGE LOAD
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadProducts();

    }
);


// =====================================================
// LOAD PRODUCTS
// =====================================================

async function loadProducts() {

    try {

        const response =
            await fetch(API);

        const data =
            await response.json();

        console.log(
            "Products:",
            data
        );


        if (!data.success) {

            table.innerHTML = `
                <tr>

                    <td
                        colspan="7"
                        class="text-center text-danger">

                        Unable to load products

                    </td>

                </tr>
            `;

            return;

        }


        table.innerHTML = "";


        if (
            !data.products ||
            data.products.length === 0
        ) {

            table.innerHTML = `
                <tr>

                    <td
                        colspan="7"
                        class="text-center">

                        No products found

                    </td>

                </tr>
            `;

            return;

        }


        data.products.forEach(
            product => {

                let imageUrl =
                    product.image;


                /*
                 * If database contains:
                 * /uploads/file.jpg
                 */

                if (
                    imageUrl &&
                    !imageUrl.startsWith("http")
                ) {

                    imageUrl =
                        "http://localhost:5000" +
                        (
                            imageUrl.startsWith("/")
                            ? imageUrl
                            : "/" + imageUrl
                        );

                }


                table.innerHTML += `

                    <tr>

                        <td>
                            ${product.id}
                        </td>


                        <td>

                            ${
                                imageUrl

                                ?

                                `
                                <img
                                    src="${imageUrl}"
                                    width="60"
                                    height="60"
                                    style="
                                        border-radius:10px;
                                        object-fit:cover;
                                    "
                                >
                                `

                                :

                                `
                                <div
                                    style="
                                        width:60px;
                                        height:60px;
                                        background:#eee;
                                        border-radius:10px;
                                        display:flex;
                                        align-items:center;
                                        justify-content:center;
                                    "
                                >

                                    <i class="bi bi-image"></i>

                                </div>
                                `
                            }

                        </td>


                        <td>
                            <strong>
                                ${product.name}
                            </strong>
                        </td>


                        <td>
                            ${product.category || "-"}
                        </td>


                        <td>
                            ₹${Number(
                                product.price
                            ).toFixed(2)}
                        </td>


                        <td>

                            <span class="badge ${
                                Number(product.stock) <= 5
                                ? "bg-danger"
                                : Number(product.stock) <= 10
                                ? "bg-warning text-dark"
                                : "bg-success"
                            }">

                                ${product.stock}

                            </span>

                        </td>


                        <td>

                            <button
                                class="btn btn-primary btn-sm"
                                onclick="
                                    editProduct(
                                        ${product.id}
                                    )
                                "
                            >

                                <i class="bi bi-pencil"></i>

                            </button>


                            <button
                                class="btn btn-danger btn-sm"
                                onclick="
                                    deleteProduct(
                                        ${product.id}
                                    )
                                "
                            >

                                <i class="bi bi-trash"></i>

                            </button>

                        </td>

                    </tr>

                `;

            }
        );

    }

    catch (error) {

        console.error(
            "Load Products Error:",
            error
        );


        table.innerHTML = `
            <tr>

                <td
                    colspan="7"
                    class="text-center text-danger">

                    Server connection error

                </td>

            </tr>
        `;

    }

}


// =====================================================
// SEARCH
// =====================================================

search.addEventListener(
    "input",
    function () {

        const value =
            search.value
                .toLowerCase()
                .trim();


        const rows =
            table.querySelectorAll("tr");


        rows.forEach(row => {

            row.style.display =
                row.innerText
                    .toLowerCase()
                    .includes(value)
                    ? ""
                    : "none";

        });

    }
);


// =====================================================
// PREPARE ADD PRODUCT
// =====================================================

function prepareAddProduct() {

    form.reset();

    document.getElementById(
        "productId"
    ).value = "";


    document.getElementById(
        "modalTitle"
    ).innerText =
        "Add Product";


    document.getElementById(
        "saveButton"
    ).innerHTML = `

        <i class="bi bi-plus-circle"></i>

        Add Product

    `;


    document.getElementById(
        "imagePreview"
    ).style.display =
        "none";

}


// =====================================================
// IMAGE PREVIEW
// =====================================================

document.getElementById(
    "image"
).addEventListener(
    "change",
    function () {

        const file =
            this.files[0];


        if (!file) {

            return;

        }


        const preview =
            document.getElementById(
                "imagePreview"
            );


        preview.src =
            URL.createObjectURL(
                file
            );


        preview.style.display =
            "block";

    }
);


// =====================================================
// ADD PRODUCT
// =====================================================

form.addEventListener(
    "submit",
    async function (e) {

        e.preventDefault();


        try {

            const formData =
                new FormData();


            formData.append(
                "name",
                document.getElementById(
                    "name"
                ).value.trim()
            );


            formData.append(
                "category",
                document.getElementById(
                    "category"
                ).value.trim()
            );


            formData.append(
                "price",
                document.getElementById(
                    "price"
                ).value
            );


            formData.append(
                "stock",
                document.getElementById(
                    "stock"
                ).value
            );


            formData.append(
                "description",
                document.getElementById(
                    "description"
                ).value.trim()
            );


            const image =
                document.getElementById(
                    "image"
                ).files[0];


            if (image) {

                formData.append(
                    "image",
                    image
                );

            }


            const button =
                document.getElementById(
                    "saveButton"
                );


            button.disabled =
                true;


            button.innerHTML = `
                <span
                    class="spinner-border spinner-border-sm">
                </span>

                Saving...
            `;


            const response =
                await fetch(
                    API,
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            console.log(
                "Add Product Response:",
                data
            );


            if (!response.ok) {

                alert(
                    "❌ " +
                    (
                        data.message ||
                        "Product could not be added"
                    )
                );

                return;

            }


            if (data.success) {

                alert(
                    "✅ Product added successfully"
                );


                form.reset();


                const modal =
                    bootstrap.Modal
                        .getInstance(
                            document.getElementById(
                                "productModal"
                            )
                        );


                if (modal) {

                    modal.hide();

                }


                loadProducts();

            }

            else {

                alert(
                    "❌ " +
                    (
                        data.message ||
                        "Product could not be added"
                    )
                );

            }

        }

        catch (error) {

            console.error(
                "Add Product Error:",
                error
            );


            alert(
                "❌ Server Error. Check backend."
            );

        }

        finally {

            const button =
                document.getElementById(
                    "saveButton"
                );


            button.disabled =
                false;


            button.innerHTML = `
                <i class="bi bi-check-circle"></i>

                Save Product
            `;

        }

    }
);


// =====================================================
// DELETE PRODUCT
// =====================================================

async function deleteProduct(id) {

    if (
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                API + "/" + id,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (data.success) {

            alert(
                "✅ " +
                (
                    data.message ||
                    "Product deleted"
                )
            );


            loadProducts();

        }

        else {

            alert(
                "❌ " +
                (
                    data.message ||
                    "Unable to delete product"
                )
            );

        }

    }

    catch (error) {

        console.error(
            "Delete Error:",
            error
        );


        alert(
            "Server Error"
        );

    }

}


// =====================================================
// EDIT PRODUCT
// =====================================================

function editProduct(id) {

    alert(
        "Edit Product feature will be added next."
    );

}


// =====================================================
// LOGOUT
// =====================================================

function logout() {

    localStorage.clear();

    window.location.href =
        "../pages/login.html";

}

</script>

</body>

</html>
