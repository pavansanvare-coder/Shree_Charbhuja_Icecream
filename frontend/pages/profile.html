<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style> .profile-card{

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.profile-img{

width:140px;

height:140px;

border-radius:50%;

border:5px solid #f59e0b;

object-fit:cover;

}

label{

font-weight:600;

margin-bottom:5px;

}

.form-control{

height:50px;

border-radius:12px;

}</style>

<title>Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/profile.css">

</head>

<body>

<div class="d-flex">

<div class="sidebar">

<h3>🍦 Icecream</h3>

<a href="dashboard.html">
<i class="bi bi-speedometer2"></i>
Dashboard
</a>

<a href="products.html">
<i class="bi bi-grid"></i>
Products
</a>

<a href="cart.html">
<i class="bi bi-cart3"></i>
Cart
</a>

<a href="orders.html">
<i class="bi bi-bag"></i>
Orders
</a>

<a class="active" href="profile.html">
<i class="bi bi-person-circle"></i>
Profile
</a>

<a href="#" onclick="logout()">
<i class="bi bi-box-arrow-right"></i>
Logout
</a>

</div>

<div class="content">

<div class="card profile-card">

<div class="text-center">

<img id="profileImage"
src="https://ui-avatars.com/api/?name=User&background=f59e0b&color=fff&size=150"
class="profile-img">

<h2 id="userName" class="mt-3"></h2>

<p class="text-muted">
Customer
</p>

</div>

<hr>

<div class="row">

<div class="col-md-6 mb-3">

<label>Name</label>

<input
id="name"
class="form-control"
readonly>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input
id="email"
class="form-control"
readonly>

</div>

</div>

<button class="btn btn-warning mt-3">
Edit Profile
</button>

<button class="btn btn-outline-danger mt-3 ms-2">
Change Password
</button>

</div>

</div>

</div>

<script src="../js/profile.js">
    const user = JSON.parse(localStorage.getItem("user"));

if(!user){

window.location.href="login.html";

}

document.getElementById("userName").innerText=user.name;

document.getElementById("name").value=user.name;

document.getElementById("email").value=user.email;

document.getElementById("profileImage").src=
`https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=f59e0b&color=fff&size=150`;

function logout(){

localStorage.removeItem("user");

localStorage.removeItem("token");

window.location.href="login.html";

}
</script>

</body>

</html>
