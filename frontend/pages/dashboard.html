<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | Shree Charbhuja Icecream</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar">

        <h3 class="text-warning text-center mt-3">
            🍦 Icecream
        </h3>

        <a href="../index.html">
            <i class="bi bi-house"></i>
            Home
        </a>

        <a href="products.html">
            <i class="bi bi-grid"></i>
            Products
        </a>

        <a href="cart.html">
            <i class="bi bi-cart"></i>
            My Cart
        </a>

        <a href="orders.html">
            <i class="bi bi-bag"></i>
            My Orders
        </a>

        <a href="profile.html">
            <i class="bi bi-person"></i>
            Profile
        </a>

        <a href="#" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

    </div>

    <!-- Main -->
    <div class="content">

        <h2>
            Welcome,
            <span id="username"></span>
            👋
        </h2>

        <div class="row mt-4">

            <div class="col-md-3">

                <div class="card dashboard-card">

                    <h3 id="cartCount">0</h3>

                    <p>Cart Items</p>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card dashboard-card">

                    <h3>0</h3>

                    <p>Orders</p>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card dashboard-card">

                    <h3>₹0</h3>

                    <p>Total Spent</p>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card dashboard-card">

                    <h3>★ 5</h3>

                    <p>Loyalty</p>

                </div>

            </div>

        </div>

        <div class="card mt-5 p-4">

            <h4>

                🍨 Welcome to Shree Charbhuja Icecream

            </h4>

            <p>

                Browse our latest flavours, manage your cart,
                track your orders and enjoy delicious ice creams.

            </p>

            <a href="products.html" class="btn btn-warning">

                Explore Products

            </a>

        </div>

    </div>

</div>

<script src="../js/dashboard.js"></script>

</body>

</html>
